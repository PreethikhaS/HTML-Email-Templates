<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Invitation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #e9ecef; }
    .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 20px; }
    h1 { color: #333333; }
    .banner { width: 100%; height: auto; }
    .btn { background-color: #ffc107; color: #333333; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>You're Invited!</h1>
    <img src="banner.jpg" alt="Event Banner" class="banner" />
    <p>Join us for an exciting event with amazing speakers, networking opportunities, and more!</p>
    <a href="#" class="btn">RSVP Now</a>
  </div>
</body>
</html>
