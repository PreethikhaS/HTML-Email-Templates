<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Newsletter</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; }
    .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 20px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .column { width: 48%; }
    h1 { color: #333333; }
    p { color: #555555; }
    .btn { background-color: #28a745; color: #ffffff; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Monthly News & Updates</h1>
    <div class="row">
      <div class="column">
        <h2>Product Spotlight</h2>
        <p>Discover our new product that will change the way you work!</p>
        <a href="#" class="btn">Learn More</a>
      </div>
      <div class="column">
        <h2>Customer Testimonials</h2>
        <p>Hear what our customers have to say about our service.</p>
        <a href="#" class="btn">Read Testimonials</a>
      </div>
    </div>
  </div>
</body>
</html>
