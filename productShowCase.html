<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Product Showcase</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
    }

    .email-header {
      background-color: #2c3e50;
      padding: 20px;
      color: white;
      text-align: center;
    }

    .product-gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .product-item {
      position: relative;
      overflow: hidden;
      border: 2px solid #ecf0f1;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .product-item img {
      width: 100%;
      height: auto;
      transition: transform 0.3s ease-in-out;
    }

    .product-item:hover img {
      transform: scale(1.1);
    }

    .product-item .product-info {
      position: absolute;
      bottom: 0;
      left: 0;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 10px;
      width: 100%;
      text-align: center;
      display: none;
    }

    .product-item:hover .product-info {
      display: block;
    }

    .cta-btn {
      background-color: #e74c3c;
      color: white;
      padding: 15px 30px;
      text-decoration: none;
      display: block;
      text-align: center;
      margin-top: 20px;
      border-radius: 5px;
      font-weight: bold;
    }

    .email-footer {
      background-color: #ecf0f1;
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: #7f8c8d;
    }

    .footer-social {
      margin: 15px 0;
    }

    .footer-social a {
      text-decoration: none;
      color: #3498db;
      margin: 0 10px;
    }

    @media screen and (max-width: 600px) {
      .product-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="email-header">
      <h2>Discover Our Latest Products</h2>
    </div>

    <div class="product-gallery">
      <div class="product-item">
        <img src="https://via.placeholder.com/280x200" alt="Product 1">
        <div class="product-info">
          <h3>Product 1</h3>
          <p>$99.99</p>
          <a href="#" class="cta-btn">Buy Now</a>
        </div>
      </div>
      <div class="product-item">
        <img src="https://via.placeholder.com/280x200" alt="Product 2">
        <div class="product-info">
          <h3>Product 2</h3>
          <p>$129.99</p>
          <a href="#" class="cta-btn">Buy Now</a>
        </div>
      </div>
    </div>

    <div class="email-footer">
      <p>Follow us on social media:</p>
      <div class="footer-social">
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
      </div>
    </div>
  </div>
</body>
</html>
