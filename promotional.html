<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promotional Email</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
    .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 20px; }
    h1 { color: #333333; }
    p { color: #555555; }
    .btn { background-color: #007bff; color: #ffffff; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Special Offer Just for You!</h1>
    <p>We're excited to offer you an exclusive deal on our products. This is a limited-time offer, so don't wait!</p>
    <a href="#" class="btn">Shop Now</a>
  </div>
</body>
</html>
